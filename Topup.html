<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DaffaStore — Top Up Game</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<style>
:root {
  --bg:#07090f;--s1:#0d1017;--s2:#131720;--s3:#181e2c;
  --b1:#1e2538;--b2:#252d42;
  --cyan:#00d4ff;--purple:#7c3aed;--pink:#ec4899;--green:#10b981;--gold:#f59e0b;--red:#ef4444;
  --t1:#f1f5f9;--t2:#94a3b8;--t3:#475569;
  --r:12px;--r2:16px;--r3:20px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;overflow-x:hidden}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--s1)}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}

/* BG FX */
.bg-fx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-fx span{position:absolute;border-radius:50%;filter:blur(100px);opacity:.5}
.bg-fx span:nth-child(1){width:700px;height:700px;background:rgba(124,58,237,.07);top:-200px;right:-200px}
.bg-fx span:nth-child(2){width:500px;height:500px;background:rgba(0,212,255,.05);bottom:-100px;left:-100px}
.bg-fx span:nth-child(3){width:400px;height:400px;background:rgba(236,72,153,.05);top:50%;left:30%}

/* NAV */
nav{position:sticky;top:0;z-index:200;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,48px);background:rgba(7,9,15,.9);backdrop-filter:blur(24px);border-bottom:1px solid var(--b1)}
.logo{font-size:1.3rem;font-weight:800;letter-spacing:-0.5px;cursor:pointer}
.logo b{color:var(--cyan)}
.nav-menu{display:flex;gap:4px}
.nav-menu button{background:none;border:none;color:var(--t2);font-size:.875rem;font-weight:500;padding:7px 14px;border-radius:8px;cursor:pointer;transition:.2s}
.nav-menu button:hover,.nav-menu button.active{color:var(--t1);background:var(--s2)}
.nav-right{display:flex;gap:10px;align-items:center}
.badge-cart{position:relative;cursor:pointer}
.badge-cart .dot{position:absolute;top:-3px;right:-3px;width:8px;height:8px;background:var(--cyan);border-radius:50%;border:2px solid var(--bg)}

/* PAGES */
.page{display:none;position:relative;z-index:1}
.page.active{display:block}

/* HERO */
.hero{text-align:center;padding:clamp(40px,8vw,90px) 20px 50px;max-width:820px;margin:0 auto}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.2);border-radius:100px;padding:5px 16px;font-size:.78rem;font-weight:600;color:var(--cyan);margin-bottom:24px;letter-spacing:.3px}
.hero h1{font-size:clamp(2rem,5vw,3.8rem);font-weight:900;line-height:1.1;letter-spacing:-1.5px;margin-bottom:16px}
.grad-text{background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{color:var(--t2);font-size:clamp(.95rem,2vw,1.1rem);line-height:1.7;max-width:560px;margin:0 auto 36px}

/* STATS BAR */
.stats-bar{display:flex;justify-content:center;gap:clamp(24px,5vw,60px);padding:20px 20px 56px;flex-wrap:wrap}
.stat-item{text-align:center}
.stat-num{font-size:1.8rem;font-weight:900;line-height:1}
.stat-lbl{font-size:.72rem;color:var(--t3);margin-top:5px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}

/* PROMO TICKER */
.ticker-wrap{overflow:hidden;background:linear-gradient(135deg,rgba(124,58,237,.12),rgba(0,212,255,.08));border-top:1px solid var(--b1);border-bottom:1px solid var(--b1);padding:10px 0;margin-bottom:0}
.ticker{display:flex;gap:60px;animation:ticker 30s linear infinite;width:max-content}
.ticker-item{white-space:nowrap;font-size:.8rem;color:var(--t2);font-weight:500;display:flex;align-items:center;gap:8px}
.ticker-item span{color:var(--cyan)}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* SEARCH */
.search-wrap{padding:32px clamp(16px,4vw,48px) 0;max-width:1300px;margin:0 auto;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.search-input-wrap{position:relative;flex:1;min-width:220px}
.search-input-wrap input{width:100%;background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:12px 16px 12px 44px;color:var(--t1);font-size:.9rem;outline:none;transition:.2s}
.search-input-wrap input:focus{border-color:var(--cyan)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:1rem;opacity:.5}
.filter-pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:8px 16px;border-radius:100px;font-size:.8rem;font-weight:600;cursor:pointer;transition:.2s;border:1px solid var(--b1);background:var(--s2);color:var(--t2)}
.pill:hover{border-color:var(--cyan);color:var(--cyan)}
.pill.active{background:rgba(0,212,255,.1);border-color:var(--cyan);color:var(--cyan)}

/* GAME GRID */
.section{padding:28px clamp(16px,4vw,48px);max-width:1300px;margin:0 auto}
.sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.sec-title{font-size:1.15rem;font-weight:800}
.sec-count{font-size:.8rem;color:var(--t3)}
.game-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.g-card{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r2);padding:18px 14px 16px;text-align:center;cursor:pointer;transition:all .22s;position:relative;overflow:hidden}
.g-card::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,212,255,.04),rgba(124,58,237,.04));opacity:0;transition:.22s}
.g-card:hover::after{opacity:1}
.g-card:hover{border-color:rgba(0,212,255,.4);transform:translateY(-3px);box-shadow:0 10px 32px rgba(0,212,255,.1)}
.g-icon{font-size:2.4rem;margin-bottom:10px;display:block;line-height:1}
.g-name{font-size:.85rem;font-weight:700;margin-bottom:5px;line-height:1.3}
.g-cat{font-size:.7rem;background:var(--s3);color:var(--t3);padding:2px 9px;border-radius:100px;display:inline-block}
.g-badge{position:absolute;top:8px;right:8px;font-size:.6rem;font-weight:800;padding:2px 6px;border-radius:100px;text-transform:uppercase}
.b-hot{background:var(--red);color:#fff}
.b-new{background:var(--green);color:#fff}
.b-sale{background:var(--gold);color:#000}

/* ===== TOP UP FORM ===== */
.topup-page{padding:24px clamp(16px,4vw,48px);max-width:1100px;margin:0 auto}
.back-btn{display:inline-flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--b1);border-radius:100px;padding:8px 18px;font-size:.85rem;cursor:pointer;transition:.2s;margin-bottom:24px;color:var(--t1)}
.back-btn:hover{border-color:var(--cyan);color:var(--cyan)}
.topup-layout{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
@media(max-width:768px){.topup-layout{grid-template-columns:1fr}.nav-menu{display:none}}
.t-card{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r3);padding:24px;margin-bottom:16px}
.step-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.step-num{width:30px;height:30px;background:linear-gradient(135deg,var(--cyan),var(--purple));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:800;color:#fff;flex-shrink:0}
.step-title{font-size:1rem;font-weight:700}
.step-sub{font-size:.78rem;color:var(--t3)}

/* GAME INFO HEADER */
.game-header{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,rgba(0,212,255,.06),rgba(124,58,237,.06));border:1px solid rgba(0,212,255,.15);border-radius:var(--r2);padding:18px 20px;margin-bottom:20px}
.game-header-icon{font-size:3rem;line-height:1}
.game-header-name{font-size:1.3rem;font-weight:800}
.game-header-cat{font-size:.78rem;color:var(--t2);margin-top:2px}
.game-header-tag{display:inline-flex;align-items:center;gap:5px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2);color:var(--green);font-size:.72rem;padding:3px 10px;border-radius:100px;margin-top:6px;font-weight:600}

/* FORM ELEMENTS */
.fl{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.fl label{font-size:.82rem;color:var(--t2);font-weight:600}
.fl input,.fl select{background:var(--s3);border:1px solid var(--b2);border-radius:var(--r);padding:12px 15px;color:var(--t1);font-size:.92rem;outline:none;transition:.2s;width:100%}
.fl input:focus,.fl select:focus{border-color:var(--cyan);background:var(--s1)}
.fl input::placeholder{color:var(--t3)}
.fl select option{background:var(--s1)}
.input-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-note{font-size:.74rem;color:var(--t3);margin-top:-10px}

/* VERIFY STRIP */
.verify-strip{display:flex;align-items:center;gap:10px;background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.15);border-radius:var(--r);padding:11px 14px;font-size:.82rem;color:var(--green);margin-bottom:16px}

/* NOMINAL GRID */
.nom-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:500px){.nom-grid{grid-template-columns:repeat(2,1fr)}}
.nom-card{background:var(--s3);border:1px solid var(--b2);border-radius:var(--r2);padding:14px 10px;text-align:center;cursor:pointer;transition:all .2s;position:relative}
.nom-card:hover{border-color:rgba(124,58,237,.5)}
.nom-card.sel{border-color:var(--cyan);background:rgba(0,212,255,.07);box-shadow:0 0 18px rgba(0,212,255,.1)}
.nom-check{position:absolute;top:7px;right:7px;width:18px;height:18px;border-radius:50%;background:var(--cyan);display:none;align-items:center;justify-content:center;font-size:.65rem;color:#000;font-weight:900}
.nom-card.sel .nom-check{display:flex}
.nom-amt{font-size:1.1rem;font-weight:800;color:var(--t1)}
.nom-curr{font-size:.7rem;color:var(--t3);margin-bottom:6px}
.nom-price{font-size:.82rem;font-weight:700;color:var(--cyan)}
.nom-orig{font-size:.7rem;color:var(--t3);text-decoration:line-through}
.nom-disc{position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:var(--gold);color:#000;font-size:.6rem;font-weight:800;padding:2px 8px;border-radius:100px;white-space:nowrap}

/* PAYMENT */
.pay-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pay-card{background:var(--s3);border:1px solid var(--b2);border-radius:var(--r);padding:13px;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:10px}
.pay-card:hover{border-color:rgba(124,58,237,.5)}
.pay-card.sel{border-color:var(--cyan);background:rgba(0,212,255,.06)}
.pay-icon{font-size:1.5rem;width:36px;text-align:center}
.pay-name{font-size:.85rem;font-weight:700}
.pay-desc{font-size:.7rem;color:var(--t3)}

/* COUPON */
.coupon-row{display:flex;gap:10px;margin-bottom:16px}
.coupon-row input{flex:1;background:var(--s3);border:1px solid var(--b2);border-radius:var(--r);padding:11px 14px;color:var(--t1);font-size:.88rem;outline:none;transition:.2s}
.coupon-row input:focus{border-color:var(--gold)}
.coupon-row button{padding:0 18px;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.3);border-radius:var(--r);color:var(--gold);font-size:.82rem;font-weight:700;cursor:pointer;transition:.2s;white-space:nowrap}
.coupon-row button:hover{background:rgba(245,158,11,.2)}
.coupon-ok{display:none;font-size:.78rem;color:var(--green);margin-bottom:12px;align-items:center;gap:6px}
.coupon-ok.show{display:flex}

/* SUMMARY */
.sum-card{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r3);padding:22px;position:sticky;top:72px}
.sum-title{font-size:.7rem;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:16px}
.sum-game{display:flex;align-items:center;gap:12px;padding:14px;background:var(--s3);border-radius:var(--r);margin-bottom:18px}
.sum-game-icon{font-size:2.2rem}
.sum-gname{font-size:.95rem;font-weight:800}
.sum-gsub{font-size:.75rem;color:var(--t2);margin-top:2px}
.sum-rows{border-top:1px solid var(--b1);padding-top:14px}
.sr{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:.875rem}
.sr .k{color:var(--t2)}
.sr .v{font-weight:600;text-align:right;max-width:55%}
.sr-divider{border:none;border-top:1px solid var(--b1);margin:6px 0}
.sr.total .k{font-weight:700;color:var(--t1)}
.sr.total .v{font-size:1.3rem;font-weight:900;color:var(--cyan)}
.sr.disc .v{color:var(--green)}

/* PAY BTN */
.pay-btn{width:100%;margin-top:18px;padding:16px;border-radius:var(--r2);border:none;background:linear-gradient(135deg,var(--purple),var(--cyan));color:#fff;font-size:1rem;font-weight:800;cursor:pointer;transition:all .2s;letter-spacing:.3px;box-shadow:0 4px 20px rgba(0,212,255,.2)}
.pay-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,212,255,.35)}
.pay-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.pay-btn.loading::after{content:' ⏳'}
.security-note{display:flex;align-items:center;justify-content:center;gap:6px;font-size:.72rem;color:var(--t3);margin-top:12px}

/* PAYMENT MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--s1);border:1px solid var(--b1);border-radius:24px;width:100%;max-width:460px;overflow:hidden;animation:popIn .3s cubic-bezier(.34,1.56,.64,1)}
.modal-header{background:linear-gradient(135deg,var(--purple),var(--cyan));padding:24px;text-align:center}
.modal-header .m-icon{font-size:2.8rem;margin-bottom:8px}
.modal-header h2{font-size:1.3rem;font-weight:900;color:#fff}
.modal-header p{font-size:.82rem;color:rgba(255,255,255,.75);margin-top:4px}
.modal-body{padding:24px}

/* QR PAY */
.qr-box{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r2);padding:20px;text-align:center;margin-bottom:20px}
.qr-img{width:180px;height:180px;background:#fff;border-radius:12px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:4rem;padding:10px}
.qr-timer{font-size:1.5rem;font-weight:900;color:var(--red);font-variant-numeric:tabular-nums}
.qr-timer-lbl{font-size:.72rem;color:var(--t3);margin-top:2px}
.qr-amount{font-size:1.4rem;font-weight:900;color:var(--cyan);margin:12px 0 4px}
.qr-ref{font-size:.75rem;color:var(--t3);font-family:monospace}

/* VA BOX */
.va-box{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r2);padding:20px;margin-bottom:20px}
.va-bank{font-size:.78rem;color:var(--t2);margin-bottom:6px;font-weight:600}
.va-num-row{display:flex;align-items:center;justify-content:space-between;background:var(--s3);border-radius:var(--r);padding:12px 14px}
.va-num{font-size:1.2rem;font-weight:900;font-family:monospace;letter-spacing:2px}
.copy-btn{background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.25);border-radius:8px;color:var(--cyan);padding:6px 12px;font-size:.75rem;font-weight:700;cursor:pointer;transition:.2s}
.copy-btn:hover{background:rgba(0,212,255,.2)}
.va-amount{margin-top:14px;text-align:center}
.va-amount .lbl{font-size:.78rem;color:var(--t2)}
.va-amount .val{font-size:1.5rem;font-weight:900;color:var(--cyan)}
.va-inst{font-size:.78rem;color:var(--t2);line-height:1.7;margin-top:14px;padding-top:14px;border-top:1px solid var(--b1)}
.va-inst b{color:var(--t1)}

/* STATUS STEPS */
.status-steps{display:flex;flex-direction:column;gap:0;margin-bottom:20px}
.ss{display:flex;gap:14px;align-items:flex-start;padding-bottom:16px;position:relative}
.ss:not(:last-child)::before{content:'';position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--b1)}
.ss-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0;position:relative;z-index:1}
.ss-dot.done{background:var(--green);color:#fff}
.ss-dot.active{background:var(--cyan);color:#000;animation:pulse 1.5s infinite}
.ss-dot.wait{background:var(--s3);border:2px solid var(--b2);color:var(--t3)}
.ss-info .title{font-size:.875rem;font-weight:700}
.ss-info .sub{font-size:.75rem;color:var(--t3);margin-top:2px}

.btn-full{width:100%;padding:14px;border-radius:var(--r);border:none;cursor:pointer;font-size:.9rem;font-weight:700;transition:.2s}
.btn-outline{background:transparent;border:1px solid var(--b1);color:var(--t1)}
.btn-outline:hover{border-color:var(--cyan);color:var(--cyan)}
.btn-primary{background:linear-gradient(135deg,var(--purple),var(--cyan));color:#fff;box-shadow:0 4px 16px rgba(0,212,255,.2)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(0,212,255,.35)}

/* SUCCESS */
.success-wrap{text-align:center;padding:10px 0}
.s-icon{font-size:4rem;margin-bottom:14px;animation:bounce .5s ease}
.s-title{font-size:1.4rem;font-weight:900;margin-bottom:8px}
.s-sub{font-size:.875rem;color:var(--t2);line-height:1.6;margin-bottom:20px}
.s-receipt{background:var(--s2);border-radius:var(--r2);padding:16px;text-align:left;margin-bottom:20px;font-size:.82rem}
.s-r-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--b1)}
.s-r-row:last-child{border-bottom:none}
.s-r-key{color:var(--t2)}
.s-r-val{font-weight:700;color:var(--t1)}

/* HISTORY PAGE */
.hist-grid{display:flex;flex-direction:column;gap:12px}
.h-card{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r2);padding:18px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:.2s}
.h-card:hover{border-color:var(--b2);background:var(--s3)}
.h-icon{font-size:2.2rem;width:48px;text-align:center}
.h-info{flex:1}
.h-game{font-size:.95rem;font-weight:700}
.h-item{font-size:.8rem;color:var(--t2);margin-top:2px}
.h-date{font-size:.72rem;color:var(--t3);margin-top:4px}
.h-right{text-align:right}
.h-price{font-size:.95rem;font-weight:800;color:var(--cyan)}
.h-status{display:inline-block;font-size:.68rem;font-weight:700;padding:3px 10px;border-radius:100px;margin-top:5px}
.st-success{background:rgba(16,185,129,.15);color:var(--green)}
.st-pending{background:rgba(245,158,11,.15);color:var(--gold)}
.st-failed{background:rgba(239,68,68,.15);color:var(--red)}

/* EMPTY */
.empty-state{text-align:center;padding:60px 20px;color:var(--t3)}
.empty-icon{font-size:3rem;margin-bottom:12px;opacity:.5}
.empty-text{font-size:.9rem}

/* ANIMATIONS */
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,212,255,.4)}50%{box-shadow:0 0 0 8px rgba(0,212,255,0)}}
@keyframes bounce{0%,100%{transform:scale(1)}40%{transform:scale(1.2)}70%{transform:scale(.95)}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin .8s linear infinite}

/* TOAST */
.toast-wrap{position:fixed;top:70px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--s1);border:1px solid var(--b1);border-radius:100px;padding:10px 20px;font-size:.82rem;font-weight:500;box-shadow:0 8px 32px rgba(0,0,0,.4);animation:slideIn .3s ease}
.toast.t-ok{border-color:var(--green);color:var(--green)}
.toast.t-err{border-color:var(--red);color:var(--red)}
.toast.t-info{border-color:var(--cyan);color:var(--cyan)}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}

/* UTILS */
.text-cyan{color:var(--cyan)}
.text-green{color:var(--green)}
